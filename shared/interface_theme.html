<script>
(() => {
  const root = document.documentElement;

  document.addEventListener('visibilitychange', update);

})();

/* Low-intensity moving lights breathe behind steady, opaque reading surfaces. */
body { position:relative; isolation:isolate; }
body::before, body::after {
  content:""; position:fixed; inset:-8vh -8vw; z-index:-1;
  pointer-events:none; background-repeat:no-repeat;
  --ambient-low:.60; --ambient-high:1;
  animation:ambient-blue 38s ease-in-out infinite alternate, ambient-breathe 14s ease-in-out infinite;
}
body::before {
  background:radial-gradient(ellipse 44% 46% at 18% 30%,var(--ambient-blue,rgba(91,163,255,.28)),transparent 78%),
    radial-gradient(ellipse 34% 44% at 88% 72%,var(--ambient-violet,rgba(129,140,248,.22)),transparent 78%);
}
body::after {
  background:radial-gradient(ellipse 32% 40% at 74% 18%,var(--ambient-cyan,rgba(106,226,244,.20)),transparent 80%);
  animation-name:ambient-cyan, ambient-breathe; animation-duration:47s, 18s;
  animation-delay:-19s, -7s;
}
@keyframes ambient-breathe {
  0%,100% { opacity:var(--ambient-low); }
  50% { opacity:var(--ambient-high); }
}
@keyframes ambient-blue {
  from { transform:translate3d(-3vw,-2vh,0) scale(1); }
  to { transform:translate3d(6vw,5vh,0) scale(1.07); }
}
@keyframes ambient-cyan {
  from { transform:translate3d(5vw,-3vh,0) scale(1.08); }
  to { transform:translate3d(-6vw,6vh,0) scale(1); }
}
.af-hero:has(.audit-film) { background:radial-gradient(ellipse at 82% 38%,var(--wash),transparent 68%); }
section.alt { background:color-mix(in srgb,var(--surface) 78%,transparent); }
.ambient-paused body::before, .ambient-paused body::after { animation-play-state:paused; }
html[data-theme=light] body::before, html[data-theme=light] body::after { --ambient-low:.65; --ambient-high:1; --ambient-blue:rgba(28,79,139,.22); --ambient-violet:rgba(65,74,139,.18); --ambient-cyan:rgba(20,107,137,.18); opacity:1; }
header.page h1, .hiw-step b, .fact-tile .fact-val { color:var(--ink); }
.hiw-step .hiw-num { background:var(--accent-soft); color:var(--ink); box-shadow:none; }
.drop input[type=file]::file-selector-button { color:var(--ink); background:var(--surface); }
.drop input[type=file]::file-selector-button:hover { background:var(--accent-soft); }
.detail-row td, .fact-tile { background:var(--surface); color:var(--ink); }
.primary:disabled { background:var(--surface); color:var(--ink-faint); border-color:var(--line-soft); }
@media(prefers-reduced-motion:reduce) {
  body::before, body::after { animation:none; }
}
@media print {
  body::before, body::after { display:none; }
